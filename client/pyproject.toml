[project]
name = "teletop-cli"
version = "0.1.0"
description = "teletop developer CLI — push builds to a teletop server, stream monitor output"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "websockets>=13",
    "click>=8.1",
    "rich>=13.9",
]

[project.scripts]
teletop = "teletop_cli.__main__:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["teletop_cli"]
