[project]
name = "teletop-server"
version = "0.1.0"
description = "teletop FastAPI backend — ESP32 flash & monitor over the network"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pyserial>=3.5",
    "pyserial-asyncio>=0.6",
    "esptool>=4.8",
    "websockets>=13",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "pyudev>=0.24",
    "click>=8.1",
    "rich>=13.9",
    "httpx>=0.27",
]

[project.scripts]
teletop-server = "teletop_server.main:cli"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["teletop_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A system-wide ROS install (/opt/ros/humble) leaks onto sys.path via
# PYTHONPATH and registers pytest11 entry points; explicitly disable each so
# the venv stays isolated.
addopts = "-p no:ament_pep257 -p no:ament_xmllint -p no:ament_lint -p no:ament_copyright -p no:ament_flake8 -p no:launch_testing -p no:launch_ros"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
